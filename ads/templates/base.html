{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Обмен вещами{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ads/styles.css' %}">
</head>
<body>
    <header>
        <h1><a href="{% url 'ad_list' %}">Обмен вещами</a></h1>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'ad_create' %}">Новое объявление</a>
                <a href="{% url 'exchange_create' %}">Предложить обмен</a>
                <a href="{% url 'proposal_list' %}">Мои обмены</a>
                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <button type="submit">logout</button>
                </form>
            {% else %}
                <li class="last"><a href="{% url 'users:login' %}">Войти</a> | <a href="{% url 'users:register' %}">Регистрация</a> </li>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
